<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ejercicio 5 - Agregar objetos con innerHTML</title>
  <link rel="stylesheet" href="/styles/style.css">

      <h2 class="titulo-pagina">Agregar objetos con innerHTML</h2>
      <section id="editor" class="panel oculto"></section>

  <script src="/modules/script.js"></script>
